<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lush Cafe Admin</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: white;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
    }

    button {
      background: #b30000;
      color: white;
      cursor: pointer;
    }

    #dashboard {
      display: none;
    }

    .card {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container" id="loginScreen">
  <h1>Lush Cafe Admin</h1>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<div class="container" id="dashboard">
  <h1>Dashboard</h1>

  <div class="card">
    Menu Management
  </div>

  <div class="card">
    Weekly Events
  </div>

  <div class="card">
    Reservations
  </div>

  <button id="logoutBtn">Logout</button>
</div>

<script type="module">
import { login, logout } from "./src/js/auth.js";

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

loginBtn.addEventListener("click", async () => {
  try {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    await login(email, password);

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

  } catch (error) {
    alert(error.message);
  }
});

logoutBtn.addEventListener("click", async () => {
  await logout();
  location.reload();
});
</script>

</body>
</html>
