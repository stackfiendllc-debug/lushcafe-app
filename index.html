<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lush Cafe App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <h1>Lush Cafe App</h1>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="loginBtn">Login</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <h2>Lush Cafe Dashboard</h2>

    <button id="logoutBtn">Sign Out</button>

    <h3>Live Menu</h3>
    <div id="menuContainer"></div>

    <h3>Upcoming Events</h3>
    <div id="eventsContainer"></div>

    <h3>Book a Table</h3>
    <div id="reservationContainer"></div>

    <input type="text" id="customerName" placeholder="Guest Name" />
    <input type="tel" id="customerPhone" placeholder="Phone Number" />
    <input type="email" id="customerEmail" placeholder="Email" />
    <input type="date" id="reservationDate" />
    <input type="time" id="reservationTime" />
    <input type="number" id="partySize" placeholder="Party Size" />
    <input type="text" id="specialRequest" placeholder="Special Requests" />

    <button id="bookBtn">Book Table</button>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
