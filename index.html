<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lush Cafe App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <h1>Lush Cafe App</h1>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="loginBtn">Login</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">

    <h2>Lush Cafe Dashboard</h2>

    <button id="logoutBtn">Sign Out</button>

    <h3>Live Menu</h3>
    <div id="menuContainer"></div>

    <h3>Upcoming Events</h3>
    <div id="eventsContainer"></div>

    <h3>Book a Reservation</h3>

    <form id="reservationForm">
      <input id="guestName" placeholder="Full Name" required />
      <input id="phone" placeholder="Phone Number" required />
      <input id="reservationEmail" type="email" placeholder="Email" required />
      <input id="partySize" type="number" placeholder="Party Size" required />
      <input id="reservationDate" type="date" required />
      <input id="reservationTime" type="time" required />
      <textarea id="specialRequests" placeholder="Special Requests"></textarea>

      <button type="submit">Reserve Table</button>
    </form>

  </div>

  <script type="module" src="index.js"></script>

</body>
</html>
