<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lush Cafe App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
    }

    button {
      background: #c62828;
      color: white;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .menu-item {
      background: #222;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPage">
    <h1>Lush Cafe App</h1>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="loginBtn">Login</button>
    <p id="loginStatus"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage" class="hidden">
    <h1>Lush Dashboard</h1>

    <h2>Live Menu</h2>
    <div id="menuList"></div>
  </div>

</div>

<script type="module">
import { supabase } from "./src/js/supabase.js";

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("loginStatus").innerText = error.message;
    console.error(error);
    return;
  }

  document.getElementById("loginStatus").innerText = "Login success";

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("dashboardPage").classList.remove("hidden");

  loadMenu();
}

async function loadMenu() {
  const { data, error } = await supabase
    .from("menu_items")
    .select("*");

  console.log("MENU DATA:", data);

  if (error) {
    console.error(error);
    document.getElementById("menuList").innerHTML =
      "<p>Error loading menu</p>";
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("menuList").innerHTML =
      "<p>No menu items found.</p>";
    return;
  }

  document.getElementById("menuList").innerHTML = data.map(item => `
    <div class="menu-item">
      <strong>${item.name}</strong><br>
      ${item.description || ""}<br>
      $${item.price}
    </div>
  `).join("");
}

document.getElementById("loginBtn").addEventListener("click", login);
</script>

</body>
</html>
