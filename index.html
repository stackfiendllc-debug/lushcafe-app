<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lush Cafe App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    input, button {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 10px auto;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #2ecc71;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 15px auto;
      border-radius: 10px;
      max-width: 500px;
      text-align: left;
    }

    h1, h2, h3 {
      color: #2ecc71;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <h1>Lush Cafe App</h1>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="loginBtn">Sign In</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <h2>Lush Cafe Dashboard</h2>

    <button id="logoutBtn">Sign Out</button>

    <h3>Live Menu</h3>
    <div id="menuContainer"></div>

    <h3>Upcoming Events</h3>
    <div id="eventsContainer"></div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
